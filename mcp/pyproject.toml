[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jsdk-joint-mcp"
version = "0.1.0"
description = "MCP server for CyberBeast joint modules — help an AI agent get the joint working"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
# ⚠ 不能把 Python 绑定列为**硬依赖**：`cyberbeast-joint-sdk` 尚未发布到 PyPI，
#    硬依赖会让本包**根本装不上**（pip 解析依赖就失败）。
#    绑定缺失时 paths.py 会给出可执行的提示（JSDK_PYTHON_SRC / 走仓库内 bindings/python）。
#    等绑定发上去了，再 `pip install jsdk-joint-mcp[sdk]`。
dependencies = []

[project.optional-dependencies]
sdk = ["cyberbeast-joint-sdk>=0.1"]

[project.scripts]
jsdk-joint-mcp = "jsdk_joint_mcp.server:main"

[tool.setuptools]
packages = ["jsdk_joint_mcp"]
