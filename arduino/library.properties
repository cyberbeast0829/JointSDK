name=CyberBeast Joint SDK
version=0.1.0
author=JointSDK team
maintainer=JointSDK team
sentence=CyberBeast CAN/CAN-FD 关节 SDK（纯 C，零 malloc，自带 CAN FD 编解码）。
paragraph=把 CYBERBEAST CAN 协议（29-bit 扩展帧、MIT 力位混合、参数 SDO、JSON 端点描述符、广播同步）封装成与硬件无关的 C 库。传输层由你提供一个 3 回调的 HAL（send/recv/now_ms），因此任何 CAN 控制器（MCP2515/SPI、ESP32 TWAI、STM32 FDCAN、以及 slcan 适配器）都能接。本库为 MCU 场景设计：零动态分配（上下文与 arena 都由调用者给静态缓冲）、不建线程、控制循环由 loop() 驱动。
category=Communication
url=https://example.invalid/joint-sdk
architectures=*
includes=jsdk_can_amalgam.h
